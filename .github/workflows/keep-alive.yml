# Free Supabase databases pause after 7 days without activity.
# This visits the site's health page every 3 days, which runs a small database query.
# (vercel.json also does this once a day; this is a backup.)
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables tab →
#        New repository variable: SITE_URL = https://your-site.vercel.app
name: Keep database awake

on:
  schedule:
    - cron: "23 5 */3 * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health check
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::warning::SITE_URL variable is not set, skipping."
            exit 0
          fi
          for i in 1 2 3; do
            if curl -fsS --max-time 60 "${SITE_URL%/}/api/health"; then exit 0; fi
            echo "Attempt $i failed, retrying in 30s"; sleep 30
          done
          echo "::error::Health check failed"; exit 1
